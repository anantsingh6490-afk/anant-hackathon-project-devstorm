<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roommate Rent Splitter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="card">
      <h1>🏠 Roommate Rent Splitter</h1>
      <p class="subtitle">
        Calculate a fair per-person housing cost and check affordability.
      </p>

      <div class="form-group">
        <label for="rent">Monthly Rent ($)</label>
        <input type="number" id="rent" placeholder="e.g. 2400" min="0">
      </div>

      <div class="form-group">
        <label for="utilities">Monthly Utilities ($)</label>
        <input type="number" id="utilities" placeholder="e.g. 300" min="0">
      </div>

      <div class="form-group">
        <label for="roommates">Number of Roommates</label>
        <input type="number" id="roommates" placeholder="e.g. 3" min="1" step="1">
      </div>

      <div class="form-group">
        <label for="income">Your Monthly Income ($)</label>
        <input type="number" id="income" placeholder="e.g. 4000" min="0">
      </div>

      <div class="form-group">
        <label for="incomePercent">
          Maximum Housing Percentage of Income
        </label>

        <div class="range-container">
          <input
            type="range"
            id="incomePercent"
            min="10"
            max="60"
            value="30"
          >
          <span id="percentValue">30%</span>
        </div>
      </div>

      <button id="calculateBtn">Calculate Split</button>

      <div id="results" class="results hidden">
        <h2>Results</h2>

        <div class="result-row">
          <span>Total Monthly Housing Cost</span>
          <strong id="totalCost">$0.00</strong>
        </div>

        <div class="result-row">
          <span>Fair Cost Per Person</span>
          <strong id="perPerson">$0.00</strong>
        </div>

        <div class="result-row">
          <span>Housing Cost as % of Income</span>
          <strong id="incomeRatio">0%</strong>
        </div>

        <div id="status" class="status"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
